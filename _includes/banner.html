{%- comment -%}Full-width photo banner. Set banner, banner_alt and banner_caption in a page's front matter.{%- endcomment -%}
<figure class="banner">
<img src="{{ page.banner | relative_url }}" alt="{{ page.banner_alt }}" width="800" height="477">
{% if page.banner_caption %}<figcaption class="wrap">{{ page.banner_caption }}</figcaption>{% endif %}
</figure>
