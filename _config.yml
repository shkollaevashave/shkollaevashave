# Site settings. Change the [BRACKETED] values before going live.
title: "Shkolla e vashave"
description: "Shkolla e parë shqipe e [QYTETI], ndërtesë e fundit të shekullit XIX. Historia, oraret e vizitave, udhëtime shkollore dhe lajme."
lang: sq
locale: sq_AL

# While on the free address: https://[org-name].github.io
# After the switch: https://shkollaevashave.al  (and set baseurl to "")
url: "https://shkollaevashave.github.io"
baseurl: ""

timezone: Europe/Tirane
permalink: /lajme/:year/:month/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: lajme/feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, lang: sq }
  - scope: { path: "" }
    values: { layout: page, lang: sq }

exclude:
  - README.md
  - HOUSE-STYLE.md
  - docs/
  - Gemfile
  - Gemfile.lock
