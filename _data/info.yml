notice: "të paktën dy javë"
visits_text: "Shkolla ende nuk ka orar të rregullt vizitash. Vizitat organizohen me rezervim paraprak me email."
visits_future: "Oraret e rregullta do të njoftohen këtu."

# Fixed opening hours, for later. Set by_appointment: false to show them.
# Use 24-hour times; leave open/close empty for closed days.
